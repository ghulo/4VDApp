# Dependabot opens pull requests when a package 4VD uses has a newer or safer
# version. Once a week, grouped so each app gets one pull request for minor
# and patch updates instead of one per package. Security fixes come at once,
# whatever the schedule. Each pull request runs the full Checks workflow.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dashboard-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      desktop-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mail
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      mail-minor-and-patch:
        update-types: [minor, patch]

  # The GitHub Actions the workflows use (checkout, setup-node, wrangler…).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
