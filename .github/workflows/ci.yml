# Runs every check on every push and pull request, so a broken change shows
# up on GitHub (red cross) before it reaches the live app. On main, once every
# check is green, the last job puts the dashboard live at 4vd.app.
name: Checks

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older, now pointless run
# (a dashboard upload cut short this way is fine: the newer run uploads again).
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (types and tests)
    runs-on: ubuntu-latest
    # The full suite now runs past 15 minutes; a timeout shows as "cancelled"
    # and holds back both Render and the dashboard deploy.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: four_vd_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d four_vd_app_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway values for the test run only; nothing here is a real secret.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/four_vd_app_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/four_vd_app_test
      JWT_SECRET: ci-only-secret-that-is-long-enough
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Stops on any known high or critical security hole in a package.
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend-image:
    name: Backend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Only checks the image builds; Render builds its own copy to run.
      - run: docker build -t 4vd-backend backend

  admin:
    name: Dashboard (build, lint and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      # Stops on any known high or critical security hole in a package.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile app (types)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  mail:
    name: Bills email worker (tests and audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mail/package-lock.json
      - run: npm ci
      # Stops on any known high or critical security hole in a package.
      - run: npm audit --audit-level=high
      - run: npm test

  desktop-audit:
    name: Windows app (security audit, warning only)
    # A hole here needs an Electron upgrade tried on the shop PC first, so it
    # shows as a warning on the run instead of a red check (Render waits for
    # every check, so a red one would hold back the API).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high || echo "::warning title=Windows app::npm audit found a high or critical security hole; see this step's log"

  deploy-dashboard:
    name: Put the dashboard live (4vd.app)
    # Only after every check above passes, and only for pushes to main. Render
    # waits for all checks too, this one included, so a failed upload here also
    # holds back the API: the two stay on the same version.
    needs: [backend, backend-image, admin, mobile, mail]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      # The public addresses (VITE_API_URL, VITE_SENTRY_DSN ...) come from admin/.env.production.
      - run: npm run build
        env:
          # Tags Sentry reports with the commit, like Render does for the API.
          VITE_RELEASE: ${{ github.sha }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin
          wranglerVersion: '4.156.0'
          command: deploy
