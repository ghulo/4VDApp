# Runs the checks on pushes to main and on pull requests, so a broken change
# shows up on GitHub (red cross) before it reaches the live app. On main, once
# every check is green, the last job puts the dashboard live at 4vd.app.
#
# The repo is private and GitHub's free plan has 2,000 Actions minutes a month,
# so each job only runs when its own folder (or this file) changed: a change to
# progress.md or the docs runs nothing, a dashboard-only change skips the
# 20-minute backend suite. Pushes to other branches run nothing until they are
# opened as a pull request or merged into main.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

# On a pull request a newer push cancels the older, now pointless run. On main
# runs never cancel each other: they wait in line. A cancelled main run once let
# a code commit go untested while the docs push after it looked green.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Which parts changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      admin: ${{ steps.filter.outputs.admin }}
      e2e: ${{ steps.filter.outputs.e2e }}
      mail: ${{ steps.filter.outputs.mail }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # On main, compare with the last commit whose checks all passed, not just
      # the previous push: a push that only touches docs then still tests code
      # from an earlier push whose run failed or never finished.
      - name: Last green commit on main
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" -q '.workflow_runs[0].head_sha' || true)
          echo "sha=${sha:-${{ github.event.before }}}" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            ci: &ci
              - '.github/workflows/ci.yml'
            backend:
              - *ci
              - 'backend/**'
            admin:
              - *ci
              - 'admin/**'
            e2e:
              - *ci
              - 'backend/**'
              - 'admin/**'
              - 'e2e/**'
            mail:
              - *ci
              - 'mail/**'
            desktop:
              - *ci
              - 'desktop/**'

  backend:
    name: Backend (types and tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # The full suite now runs past 15 minutes; a timeout shows as "cancelled"
    # and holds back both Render and the dashboard deploy.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: four_vd_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d four_vd_app_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway values for the test run only; nothing here is a real secret.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/four_vd_app_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/four_vd_app_test
      JWT_SECRET: ci-only-secret-that-is-long-enough
      # The runner may have only 2 cores; tests mostly wait on Postgres, so run 4 files at once anyway.
      VITEST_MAX_WORKERS: 4
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Stops on a high or critical security hole in a package that ships to
      # users. Holes only in dev tools (vite, vitest…) warn instead: an advisory
      # with no fixed version once blocked every deploy.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high || echo "::warning title=Dev tools::npm audit found a high or critical hole in a dev tool; see this step's log"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend-image:
    name: Backend Docker image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Only checks the image builds; Render builds its own copy to run.
      - run: docker build -t 4vd-backend backend

  admin:
    name: Dashboard (build, lint and tests)
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      # Stops on a high or critical security hole in a package that ships to
      # users. Holes only in dev tools (vite, vitest…) warn instead: an advisory
      # with no fixed version once blocked every deploy.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high || echo "::warning title=Dev tools::npm audit found a high or critical hole in a dev tool; see this step's log"
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mail:
    name: Bills email worker (tests and audit)
    needs: changes
    if: needs.changes.outputs.mail == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mail/package-lock.json
      - run: npm ci
      # Stops on a high or critical security hole in a package that ships to
      # users. Holes only in dev tools (vite, vitest…) warn instead: an advisory
      # with no fixed version once blocked every deploy.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high || echo "::warning title=Dev tools::npm audit found a high or critical hole in a dev tool; see this step's log"
      - run: npm test

  desktop-audit:
    name: Windows app (tests; security audit warning only)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # A hole here needs an Electron upgrade tried on the shop PC first, so it
    # shows as a warning on the run instead of a red check (Render waits for
    # every check, so a red one would hold back the API).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The fiscal printer and setup tests need no installed packages.
      - run: npm test
      - run: npm audit --audit-level=high || echo "::warning title=Windows app::npm audit found a high or critical security hole; see this step's log"

  e2e:
    name: Browser tests (money paths)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    # A real browser drives the dashboard against its own API and its own
    # database (never the shop's): a Counter sale, a supplier bill, a payroll
    # month and a return, each checked in the books and the VAT month to the cent.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway values for the test run only; nothing here is a real secret.
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/four_vd_app_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: admin
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: e2e/playwright-report
          retention-days: 14

  deploy-dashboard:
    name: Put the dashboard live (4vd.app)
    # Only after every check above passes, and only for pushes to main. Render
    # waits for all checks too, this one included, so a failed upload here also
    # holds back the API: the two stay on the same version.
    # A job skipped because its folder didn't change counts as fine; a failed
    # or cancelled one stops the deploy. Only runs when the dashboard changed.
    needs: [changes, backend, backend-image, admin, mail, e2e]
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.admin == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      # The public addresses (VITE_API_URL, VITE_SENTRY_DSN ...) come from admin/.env.production.
      - run: npm run build
        env:
          # Tags Sentry reports with the commit, like Render does for the API.
          VITE_RELEASE: ${{ github.sha }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin
          wranglerVersion: '4.156.0'
          command: deploy
