# Monthly proof that the backups can actually be opened and restored.
# Takes the newest encrypted copy that backup.yml put in Cloudflare R2, unlocks it
# with the passphrase, restores it into a throwaway Postgres on the runner and
# checks the key tables have rows. Nothing touches the live database.
# When it fails, GitHub emails the repository owner. Restore guide: docs/DEPLOYMENT.md.
#
# Uses the same secrets as backup.yml (no new ones): BACKUP_PASSPHRASE,
# R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET.
# The R2 token only needs to read here, but the backup token (Read & Write) works.
name: Backup restore check

on:
  schedule:
    # The 2nd of every month, 04:00 UTC (after a Sunday backup in most months).
    - cron: '0 4 2 * *'
  workflow_dispatch:

concurrency:
  group: backup-restore-check
  cancel-in-progress: false

jobs:
  restore:
    name: Restore the newest backup and check it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # The same major version as the live server and the dump (18).
        image: postgres:18-alpine
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: restore_check
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U restore" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # The daily backup should never be older than this; older means backup.yml stopped.
      MAX_AGE_DAYS: 2
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        run: |
          for name in PASSPHRASE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for $name (see the top of backup.yml)"; exit 1; fi
          done

      - name: Find the newest backup
        run: |
          NAME=$(aws s3 ls "s3://$R2_BUCKET/database/" --endpoint-url "$R2_ENDPOINT" \
            | awk '{print $4}' | grep -E '^4vd-[0-9]{4}-[0-9]{2}-[0-9]{2}\.dump\.gpg$' | sort | tail -n 1)
          [ -n "$NAME" ] || { echo "::error::No backups found in R2 under database/"; exit 1; }
          DAY=$(echo "$NAME" | sed 's/^4vd-\(.*\)\.dump\.gpg$/\1/')
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$DAY" +%s) ) / 86400 ))
          echo "Newest backup: $NAME ($AGE days old)"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          if [ "$AGE" -gt "$MAX_AGE_DAYS" ]; then
            echo "::error::The newest backup is $AGE days old; the daily backup has stopped working (check Actions > Database backup)"
            exit 1
          fi

      - name: Download it
        run: aws s3 cp "s3://$R2_BUCKET/database/$NAME" backup.dump.gpg --endpoint-url "$R2_ENDPOINT"

      - name: Unlock it with the passphrase
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --decrypt --output backup.dump backup.dump.gpg \
            || { echo "::error::Could not unlock the backup; is BACKUP_PASSPHRASE still the one it was made with?"; exit 1; }
          rm backup.dump.gpg

      - name: Restore and check
        # Run inside postgres:18 so pg_restore matches the dump's version.
        run: |
          docker run --rm --network host -v "$PWD:/w" -w /w \
            -e GITHUB_STEP_SUMMARY=/w/summary.md \
            postgres:18-alpine sh -c 'apk add --no-cache bash >/dev/null && bash .github/scripts/restore-check.sh backup.dump postgresql://restore:restore@localhost:5432/restore_check'
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the unlocked copy
        if: always()
        run: rm -f backup.dump backup.dump.gpg restore-errors.txt summary.md
