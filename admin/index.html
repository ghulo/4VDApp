<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v= changes with the logo, so browsers fetch the new one instead of their cached copy. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <!-- iPhone "Add to Home Screen" ignores SVG icons and needs this PNG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="4VD" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f0ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100f0e" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
    <title>4VD</title>
    <!-- Apply the saved theme before anything paints (same rules as src/theme/theme.ts). -->
    <script>
      (function () {
        var choice = 'system';
        try { choice = localStorage.getItem('4vd.theme') || 'system'; } catch (e) {}
        // Inside the Windows app the window frame follows the same choice (src/styles/desktop.css).
        if (window.fourvdDesktop) {
          document.documentElement.dataset.shell = 'desktop';
          window.fourvdDesktop.setTheme(choice === 'light' || choice === 'dark' ? choice : 'system');
        }
        if (choice !== 'light' && choice !== 'dark') {
          choice = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = choice;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
