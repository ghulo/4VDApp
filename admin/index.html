<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v= changes with the logo, so browsers fetch the new one instead of their cached copy. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
    <!-- iPhone "Add to Home Screen" ignores SVG icons and needs this PNG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=7" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="4VD" />
    <!-- cover: the page runs under an iPhone's notch and home bar, and the bars pad themselves with env(safe-area-inset-*).
         resizes-content: Android shortens the page for the on-screen keyboard (iPhone: utils/keyboardInset.ts). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#edf1f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1010" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
    <title>4VD</title>
    <!-- Apply the saved theme before anything paints (public/boot.js; a file so the CSP can refuse inline scripts). -->
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
