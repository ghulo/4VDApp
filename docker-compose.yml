# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: four-vd-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: four_vd_app
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the separate test database on first start.
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d four_vd_app']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
