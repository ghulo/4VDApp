# Render Blueprint: the whole app online in one go (see docs/DEPLOYMENT.md).
# Render reads this when you choose New > Blueprint and pick this repo.
# Each part redeploys by itself when its own folder changes on main, once the GitHub checks pass.

services:
  # The API, from backend/Dockerfile. Applies database migrations on every start.
  - name: 4vd-api
    type: web
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Free is fine for trying it out, but it sleeps when idle, and while asleep
    # no alerts or daily summary go out. Use starter for real use.
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: 4vd-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SHOP_TIME_ZONE
        value: Europe/Budapest
      # The dashboard's address, e.g. https://fourvd-dashboard.onrender.com (asked once on setup).
      - key: CORS_ORIGINS
        sync: false
      # Optional: AI helpers and computer alerts. Leave empty to keep them off.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  # The owner's dashboard: plain files, free, never sleeps.
  - name: 4vd-dashboard
    type: web
    runtime: static
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    # Every page is handled by the app itself, so unknown paths load index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The API's address, e.g. https://fourvd-api.onrender.com (asked once on setup).
      - key: VITE_API_URL
        sync: false

databases:
  - name: 4vd-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
