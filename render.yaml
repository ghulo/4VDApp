# Render Blueprint: the API and its database (see docs/DEPLOYMENT.md).
# The dashboard and the team app are hosted on Cloudflare Pages instead
# (dashboard.4vd.app and app.4vd.app); the API is api.4vd.app.
# The API redeploys by itself when backend/ changes on main, once the GitHub checks pass.

services:
  # The API, from backend/Dockerfile. Applies database migrations on every start.
  - name: 4vd-api
    type: web
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Starter (0.5 CPU, 512 MB): always on, so alerts and the daily summary go out.
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: 4vd-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SHOP_TIME_ZONE
        value: Europe/Budapest
      # Links in emails (invites, password resets) open these.
      - key: DASHBOARD_URL
        value: https://dashboard.4vd.app
      - key: TEAM_APP_URL
        value: https://app.4vd.app
      # Optional: real emails (otherwise they're only printed to the log), and Google sign-in.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Both front ends (on Cloudflare), comma-separated.
      - key: CORS_ORIGINS
        value: https://dashboard.4vd.app,https://app.4vd.app
      # Optional: AI helpers and computer alerts. Leave empty to keep them off.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # The weekly backup job tells the API it worked with this secret (same value as the GitHub secret).
      - key: BACKUP_PING_TOKEN
        sync: false

databases:
  - name: 4vd-db
    # Basic-256mb: kept for good, with point-in-time restore (3 days on the Hobby workspace).
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
